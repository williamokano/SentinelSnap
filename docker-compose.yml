services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelsnap
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelsnap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://sentinel:sentinel@db:5432/sentinelsnap?sslmode=disable
      STORAGE_BACKEND: local
      LOCAL_UPLOAD_DIR: /app/uploads
      LOCAL_BASE_URL: http://localhost:8080/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
