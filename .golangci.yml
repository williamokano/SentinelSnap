version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - staticcheck
    - gosec
    - misspell
    - unconvert
    - goimports

issues:
  exclude-rules:
    - path: cmd/server/main.go
      linters:
        - gosec
      text: "G114"
    - path: internal/hub/hub.go
      linters:
        - errcheck
      text: "w.Write"
