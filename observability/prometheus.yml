global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Allow Prometheus to receive OTLP push from the collector (push metrics mode).
# Enable with --web.enable-otlp-receiver on the Prometheus command line.
# out_of_order_time_window accepts samples arriving slightly out of order,
# which is common when the collector batches before forwarding.
storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  # Pull mode: scrape the app's /metrics endpoint directly.
  # Disable this job (or set OTEL_METRICS_MODE=push) when using push mode.
  - job_name: sentinelsnap
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /metrics
