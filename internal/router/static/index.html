<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelSnap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header>
    <span class="brand">SentinelSnap</span>
    <nav class="page-nav">
      <a href="/" class="active">Map</a>
      <a href="/feed">Feed</a>
    </nav>
    <div class="theme-toggle">
      <button id="theme-default" class="active">Default</button>
      <button id="theme-dark">Dark</button>
      <button id="theme-satellite">Satellite</button>
    </div>
  </header>
  <div id="map"></div>
  <div id="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>
  <div id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
