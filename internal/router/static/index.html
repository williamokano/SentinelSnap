<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelSnap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1a1a2e; color: #e0e0e0; padding: 12px 20px; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: space-between; }
    #map { flex: 1; }
    .popup-photos { display: flex; flex-wrap: wrap; gap: 6px; max-width: 280px; margin-top: 8px; }
    .popup-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; cursor: pointer; }
    .popup-meta { font-size: 0.8rem; color: #666; margin-top: 4px; }
    .popup-title { font-weight: 600; }
    .btn-edit { margin-top: 8px; padding: 4px 10px; background: #2471a3; color: #fff; border: none; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .btn-edit:hover { background: #1a5276; }
    .popup-actions { display: flex; gap: 6px; margin-top: 8px; }
    .name-input { font-size: 0.95rem; font-weight: 600; border: 1px solid #aaa; border-radius: 3px; padding: 1px 4px; width: 100%; max-width: 220px; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 4px 32px rgba(0,0,0,0.6); }
    #lightbox-close { position: absolute; top: 20px; right: 28px; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
    .btn-delete { margin-top: 8px; padding: 4px 10px; background: #c0392b; color: #fff; border: none; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .btn-delete:hover { background: #a93226; }
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 10000; pointer-events: none; }
    .toast { background: #1a1a2e; color: #e0e0e0; padding: 10px 16px; border-radius: 6px; font-size: 0.85rem; box-shadow: 0 2px 12px rgba(0,0,0,0.4); opacity: 0; transform: translateY(8px); transition: opacity 0.25s, transform 0.25s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.toast-danger { background: #6b1a1a; }
    .toast.toast-info { background: #1a3a6b; }
    .theme-toggle { display: flex; gap: 4px; }
    .theme-toggle button {
      background: transparent;
      border: 1px solid #555;
      color: #ccc;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle button:hover { background: #2a2a4e; border-color: #888; color: #fff; }
    .theme-toggle button.active { background: #4a90d9; border-color: #4a90d9; color: #fff; }
  </style>
</head>
<body>
  <header>
    <span>SentinelSnap</span>
    <div class="theme-toggle">
      <button id="theme-default" class="active" onclick="setTheme('default')">Default</button>
      <button id="theme-dark" onclick="setTheme('dark')">Dark</button>
      <button id="theme-satellite" onclick="setTheme('satellite')">Satellite</button>
    </div>
  </header>
  <div id="map"></div>
  <div id="lightbox">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="" />
  </div>
  <div id="toast-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    // markers stores { marker, snap } keyed by snap id
    const entries = new Map();
    const clusterGroup = L.markerClusterGroup();

    // Track which markers are in the currently spiderfied cluster so we can
    // re-spiderfy after addLayer/removeLayer collapses it.
    let spiderfiedMarkers = null;
    clusterGroup.on('spiderfied',   e => { spiderfiedMarkers = e.markers.slice(); });
    clusterGroup.on('unspiderfied', ()  => { spiderfiedMarkers = null; });

    function withSpiderfyPreserved(fn) {
      const saved = spiderfiedMarkers ? spiderfiedMarkers.slice() : null;
      fn();
      if (!saved) return;
      // addLayer/removeLayer unspiderfies synchronously; re-spiderfy on next tick
      // after markercluster has finished re-clustering.
      setTimeout(() => {
        for (const m of saved) {
          if (!clusterGroup.hasLayer(m)) continue;
          const parent = clusterGroup.getVisibleParent(m);
          if (parent && typeof parent.spiderfy === 'function') {
            parent.spiderfy();
            return;
          }
        }
      }, 0);
    }

    const map = L.map('map').setView([20, 0], 2);

    const TILE_THEMES = {
      default: {
        url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        options: {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
      },
      dark: {
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        options: {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20
        }
      },
      satellite: {
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        options: {
          attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
          maxZoom: 19
        }
      }
    };

    let currentTileLayer = null;

    function setTheme(name) {
      if (!TILE_THEMES[name]) return;
      if (currentTileLayer) map.removeLayer(currentTileLayer);
      const { url, options } = TILE_THEMES[name];
      currentTileLayer = L.tileLayer(url, options).addTo(map);
      localStorage.setItem('mapTheme', name);
      document.querySelectorAll('.theme-toggle button').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('theme-' + name);
      if (activeBtn) activeBtn.classList.add('active');
    }

    // Restore persisted theme or fall back to default
    setTheme(localStorage.getItem('mapTheme') || 'default');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    document.getElementById('lightbox-close').onclick = () => lightbox.classList.remove('open');
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); };

    function openLightbox(url) {
      lightboxImg.src = url;
      lightbox.classList.add('open');
    }

    function showToast(msg, variant = '') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast' + (variant ? ' toast-' + variant : '');
      el.textContent = msg;
      container.appendChild(el);
      requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
      setTimeout(() => {
        el.classList.remove('show');
        el.addEventListener('transitionend', () => el.remove(), { once: true });
      }, 3500);
    }

    function snapLabel(snap) {
      return snap.name || ('Snap #' + snap.id);
    }

    function buildPopup(snap) {
      const photosHtml = (snap.photos || []).map(p =>
        `<img src="${p.url}" alt="photo" onclick="openLightbox(this.src)" />`
      ).join('');
      return `
        <span class="popup-title" id="snap-title-${snap.id}">${snapLabel(snap)}</span>
        <div class="popup-meta">${formatDate(snap.created_at)}<br/>${snap.latitude.toFixed(5)}, ${snap.longitude.toFixed(5)}</div>
        <div class="popup-photos">${photosHtml || '<em>No photos</em>'}</div>
        <div class="popup-actions">
          <button class="btn-edit" onclick="event.stopPropagation(); startRename(${snap.id})">Edit</button>
          <button class="btn-delete" onclick="deleteSnap(${snap.id})">Delete</button>
        </div>
      `;
    }

    function startRename(id) {
      const entry = entries.get(id);
      if (!entry) return;
      const titleEl = document.getElementById('snap-title-' + id);
      if (!titleEl) return;
      const current = entry.snap.name || '';
      const input = document.createElement('input');
      input.className = 'name-input';
      input.value = current;
      input.maxLength = 100;
      input.placeholder = 'Snap #' + id;
      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      async function save() {
        if (saved) return;
        saved = true;
        const name = input.value.trim();
        input.replaceWith(titleEl);
        if (name === current) return;
        await fetch(`/snaps/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        // SSE snap_updated will update the popup for everyone
      }

      input.addEventListener('blur', save);
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { saved = true; input.replaceWith(titleEl); }
      });
    }

    async function deleteSnap(id) {
      if (!confirm(`Delete "${snapLabel(entries.get(id)?.snap)}"? This cannot be undone.`)) return;
      const res = await fetch(`/snaps/${id}`, { method: 'DELETE' });
      if (!res.ok) alert('Failed to delete snap.');
      // SSE snap_deleted handles marker removal and toast for everyone
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString();
    }

    function addSnapMarker(snap) {
      if (entries.has(snap.id)) return;
      const latlng = [snap.latitude, snap.longitude];
      const marker = L.marker(latlng);
      marker.bindPopup(buildPopup(snap), { maxWidth: 320 });
      entries.set(snap.id, { marker, snap });
      withSpiderfyPreserved(() => clusterGroup.addLayer(marker));
    }

    function updateSnapMarker(id, name) {
      const entry = entries.get(id);
      if (!entry) return;
      entry.snap.name = name;
      entry.marker.setPopupContent(buildPopup(entry.snap));
    }

    async function loadSnaps() {
      let snaps;
      try {
        const res = await fetch('/snaps');
        snaps = await res.json();
      } catch (e) {
        console.error('Failed to load snaps', e);
        return;
      }

      if (!snaps || snaps.length === 0) return;

      const bounds = [];
      snaps.forEach(snap => {
        addSnapMarker(snap);
        bounds.push([snap.latitude, snap.longitude]);
      });

      map.addLayer(clusterGroup);
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    function connectEvents() {
      const es = new EventSource('/events');

      es.addEventListener('snap', e => {
        const snap = JSON.parse(e.data);
        addSnapMarker(snap);
        map.addLayer(clusterGroup);
        showToast(`New snap received: ${snapLabel(snap)}`);
      });

      es.addEventListener('snap_updated', e => {
        const { id, name } = JSON.parse(e.data);
        updateSnapMarker(id, name);
        showToast(`Snap renamed: ${name || 'Snap #' + id}`, 'info');
      });

      es.addEventListener('snap_deleted', e => {
        const { id } = JSON.parse(e.data);
        const entry = entries.get(id);
        if (entry) {
          withSpiderfyPreserved(() => { clusterGroup.removeLayer(entry.marker); entries.delete(id); });
        }
        showToast(`Snap #${id} deleted`, 'danger');
      });

      es.onerror = () => {
        // browser auto-reconnects
      };
    }

    loadSnaps();
    connectEvents();
  </script>
</body>
</html>
