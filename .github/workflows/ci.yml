name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Format, Vet, Lint, Build, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...
